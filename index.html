<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#073e67" />
    <meta name="description" content="Choose a classroom-friendly Under the Sea memory game." />
    <title>Under the Sea Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <div class="light-rays" aria-hidden="true"></div>
    <div class="bubbles left" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="bubbles right" aria-hidden="true"><i></i><i></i><i></i></div>
    <main>
      <div class="shell" aria-hidden="true">🐚</div>
      <p class="eyebrow">CLASSROOM GAMES</p>
      <h1>UNDER THE SEA<br /><span>GAME ROOM</span></h1>
      <p class="intro">Choose a memory game to begin!</p>
      <nav class="game-choices" aria-label="Choose a game">
        <a class="game-card" href="memory.html">
          <span class="card-icon" aria-hidden="true">🐢</span>
          <span class="card-copy"><strong>MEMORY GAME</strong><small>Find 8 matching picture pairs</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="game-card coral-card" href="disappeared.html">
          <span class="card-icon" aria-hidden="true">🐠</span>
          <span class="card-copy"><strong>WHAT DISAPPEARED?</strong><small>Remember which picture is missing</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

    </main>
    <div class="seabed" aria-hidden="true"><span>♒</span><b>★</b><span>♒</span></div>
